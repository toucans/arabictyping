<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arabic Typing Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@300;400;500;600&family=JetBrains+Mono:wght@500&display=swap');

  :root {
    --bg: #f4ede0;
    --bg-deep: #ebe1cf;
    --paper: #fbf6ea;
    --ink: #2a2218;
    --ink-soft: #5c4d3a;
    --ink-faint: #9a8b73;
    --accent: #8b3a1f;
    --correct: #3d5e1f;
    --correct-bg: rgba(61, 94, 31, 0.08);
    --pending: #b8a98a;
    --error: #a83a2a;
    --error-bg: rgba(168, 58, 42, 0.08);
    --hint: #e4b441;
    --border: #c9b896;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(139, 58, 31, 0.05) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(61, 94, 31, 0.04) 0%, transparent 45%);
    color: var(--ink);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    padding: 2rem 1.5rem 4rem;
    overflow-x: hidden;
  }

  .container { max-width: 920px; margin: 0 auto; }

  header {
    text-align: center;
    padding: 0.5rem 0 1.8rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
    position: relative;
  }
  header::after {
    content: '◆';
    position: absolute;
    bottom: -9px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg);
    padding: 0 14px;
    color: var(--accent);
    font-size: 0.75rem;
  }
  h1 {
    font-family: 'Amiri', serif;
    font-size: 2.3rem;
    font-weight: 400;
    letter-spacing: 0.02em;
  }
  .subtitle {
    font-size: 0.95rem;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 0.2rem;
    letter-spacing: 0.05em;
  }

  /* --- Tabs --- */
  .tabs {
    display: flex;
    gap: 0;
    justify-content: center;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    background: none;
    border: none;
    padding: 0.7rem 1.6rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    letter-spacing: 0.05em;
    transition: all 0.2s ease;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  /* --- Practice panel --- */
  .stage {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3rem 2rem 2.5rem;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 12px 30px -20px rgba(42, 34, 24, 0.25);
    position: relative;
    min-height: 280px;
  }
  .stage-corner {
    position: absolute;
    width: 18px; height: 18px;
    border: 1px solid var(--border);
  }
  .stage-corner.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
  .stage-corner.tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
  .stage-corner.bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
  .stage-corner.br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

  .progress-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    font-size: 0.85rem;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
  }
  .progress-line .meta { display: flex; gap: 1.5rem; }
  .meta-item .label { color: var(--ink-faint); }
  .meta-item .val { color: var(--ink); margin-left: 0.4em; }

  .word-display {
    font-family: 'Amiri', serif;
    font-size: 5rem;
    text-align: center;
    direction: rtl;
    line-height: 1.4;
    padding: 1.5rem 0;
    letter-spacing: 0;
    user-select: none;
    min-height: 8rem;
  }
  .word-display .letter {
    color: var(--pending);
    transition: color 0.15s ease;
    display: inline;
  }
  .word-display .letter.correct { color: var(--correct); }
  .word-display .letter.error {
    color: var(--error);
    animation: shake 0.3s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  .translit {
    text-align: center;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 1.1rem;
    margin-top: -0.5rem;
    min-height: 1.5rem;
    letter-spacing: 0.03em;
  }

  .input-area {
    margin-top: 2rem;
    text-align: center;
  }
  .hidden-input {
    position: absolute;
    left: -9999px;
    opacity: 0;
  }
  .input-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.7rem 1.2rem;
    border: 1px dashed var(--border);
    border-radius: 3px;
    display: inline-block;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .input-hint:hover { border-color: var(--accent); color: var(--accent); }
  .input-hint.focused { border-style: solid; border-color: var(--correct); color: var(--correct); }

  .controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 1rem;
  }
  .btn {
    background: transparent;
    border: 1px solid var(--ink-soft);
    color: var(--ink);
    padding: 0.55rem 1.2rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s ease;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: var(--accent); color: var(--paper); }
  .btn.subtle { border-color: var(--border); color: var(--ink-soft); font-size: 0.9rem; padding: 0.45rem 0.9rem; }

  .shortcut-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }
  kbd {
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 0.1em 0.4em;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--ink);
  }

  /* --- Keyboard hint overlay --- */
  .keyboard-overlay {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--paper);
    border-top: 1px solid var(--border);
    padding: 1.2rem 1rem 1.5rem;
    box-shadow: 0 -8px 30px -10px rgba(42, 34, 24, 0.2);
    transform: translateY(100%);
    transition: transform 0.3s ease;
    z-index: 50;
  }
  .keyboard-overlay.visible { transform: translateY(0); }
  .keyboard-overlay-inner {
    max-width: 700px;
    margin: 0 auto;
    text-align: center;
  }
  .keyboard-overlay-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-faint);
    margin-bottom: 0.7rem;
  }
  .keyboard-wrap {
    position: relative;
    display: inline-block;
    line-height: 0;
  }
  .keyboard-wrap img {
    max-width: 100%;
    height: auto;
    display: block;
    border-radius: 4px;
  }
  .key-highlight {
    position: absolute;
    border: 2px solid var(--hint);
    border-radius: 4px;
    background: rgba(228, 180, 65, 0.25);
    pointer-events: none;
    transition: all 0.2s ease;
    box-shadow: 0 0 12px rgba(228, 180, 65, 0.6);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(228, 180, 65, 0.5); }
    50% { box-shadow: 0 0 18px rgba(228, 180, 65, 0.9); }
  }

  /* --- Word list panel --- */
  .list-panel {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2rem;
  }
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.5rem;
    padding-bottom: 0.8rem;
    border-bottom: 1px solid var(--border);
  }
  .list-header h2 {
    font-family: 'Amiri', serif;
    font-size: 1.5rem;
    font-weight: 400;
  }
  .list-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
  }

  .add-form {
    display: grid;
    grid-template-columns: 2fr 2fr auto;
    gap: 0.8rem;
    margin-bottom: 1.5rem;
  }
  .add-form input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0.6rem 0.9rem;
    font-family: 'Amiri', serif;
    font-size: 1.2rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .add-form input:focus { border-color: var(--accent); }
  .add-form input.translit-input {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    direction: ltr;
  }
  .add-form input.arabic-input { direction: rtl; }

  .word-table {
    width: 100%;
    border-collapse: collapse;
  }
  .word-table tr {
    border-bottom: 1px solid var(--bg-deep);
  }
  .word-table tr:last-child { border-bottom: none; }
  .word-table td {
    padding: 0.7rem 0.5rem;
    vertical-align: middle;
  }
  .word-table .arabic-cell {
    font-family: 'Amiri', serif;
    font-size: 1.6rem;
    direction: rtl;
    text-align: right;
    width: 40%;
  }
  .word-table .translit-cell {
    color: var(--ink-soft);
    font-style: italic;
  }
  .word-table .actions-cell {
    text-align: right;
    width: 1%;
    white-space: nowrap;
  }
  .icon-btn {
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 0.3rem 0.5rem;
    font-size: 0.9rem;
    font-family: 'Cormorant Garamond', serif;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .icon-btn:hover { color: var(--error); background: var(--error-bg); }

  .empty-state {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--ink-faint);
    font-style: italic;
  }

  .toast {
    position: fixed;
    top: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--ink);
    color: var(--paper);
    padding: 0.7rem 1.3rem;
    border-radius: 3px;
    font-size: 0.95rem;
    letter-spacing: 0.03em;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    transition: transform 0.3s ease;
    z-index: 100;
  }
  .toast.visible { transform: translateX(-50%) translateY(0); }

  .completion-banner {
    text-align: center;
    padding: 2rem 1rem;
  }
  .completion-banner .check {
    font-size: 2.5rem;
    color: var(--correct);
    margin-bottom: 0.5rem;
  }
  .completion-banner p {
    font-size: 1.2rem;
    color: var(--ink-soft);
    font-style: italic;
  }

  .data-controls {
    margin-top: 1.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--bg-deep);
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  @media (max-width: 600px) {
    .word-display { font-size: 3.5rem; }
    .add-form { grid-template-columns: 1fr; }
    h1 { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>كتابة — Arabic Typing Trainer</h1>
    <div class="subtitle">type each letter; correct ones turn green</div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="practice">Practice</button>
    <button class="tab" data-tab="words">Word List</button>
  </nav>

  <!-- PRACTICE PANEL -->
  <section class="panel active" id="practice-panel">
    <div class="stage">
      <span class="stage-corner tl"></span>
      <span class="stage-corner tr"></span>
      <span class="stage-corner bl"></span>
      <span class="stage-corner br"></span>

      <div class="progress-line">
        <div class="meta">
          <div class="meta-item"><span class="label">word</span><span class="val" id="word-idx">—</span></div>
          <div class="meta-item"><span class="label">errors</span><span class="val" id="error-count">0</span></div>
        </div>
        <div class="meta">
          <div class="meta-item"><span class="label">hint</span><span class="val" id="hint-status">off</span></div>
        </div>
      </div>

      <div class="word-display" id="word-display">add some words to begin</div>
      <div class="translit" id="translit"></div>

      <div class="input-area">
        <input type="text" class="hidden-input" id="typing-input" autocomplete="off" autocapitalize="off" spellcheck="false">
        <label for="typing-input" class="input-hint" id="input-hint-label">click here, then type the word in Arabic</label>
      </div>

      <div class="controls-row">
        <div>
          <button class="btn subtle" id="prev-btn">← previous</button>
          <button class="btn subtle" id="skip-btn">skip →</button>
          <button class="btn subtle" id="reset-btn">restart</button>
        </div>
        <div class="shortcut-hint">
          <kbd>⌘</kbd> <kbd>K</kbd> toggle hint &nbsp;·&nbsp; <kbd>⌘</kbd> <kbd>→</kbd> next
        </div>
      </div>
    </div>
  </section>

  <!-- WORD LIST PANEL -->
  <section class="panel" id="words-panel">
    <div class="list-panel">
      <div class="list-header">
        <h2>Your Words</h2>
        <span class="list-count" id="list-count">0 words</span>
      </div>

      <div class="add-form">
        <input type="text" class="arabic-input" id="new-arabic" placeholder="الكلمة بالعربية">
        <input type="text" class="translit-input" id="new-translit" placeholder="meaning or transliteration (optional)">
        <button class="btn primary" id="add-btn">add word</button>
      </div>

      <table class="word-table">
        <tbody id="word-list"></tbody>
      </table>

      <div class="empty-state" id="empty-state" style="display:none">
        no words yet — add some above to start practicing
      </div>

      <div class="data-controls">
        <button class="btn subtle" id="load-sample">load sample words</button>
        <button class="btn subtle" id="export-btn">export</button>
        <button class="btn subtle" id="import-btn">import</button>
        <input type="file" id="import-file" style="display:none" accept="application/json">
        <button class="btn subtle" id="clear-all">clear all</button>
      </div>
    </div>
  </section>
</div>

<!-- KEYBOARD HINT OVERLAY -->
<div class="keyboard-overlay" id="keyboard-overlay">
  <div class="keyboard-overlay-inner">
    <div class="keyboard-overlay-label">next key · press ⌘K to hide</div>
    <div class="keyboard-wrap" id="keyboard-wrap">
      <img src="keyboard.png" alt="Arabic keyboard" id="kb-img">
      <div class="key-highlight" id="key-highlight" style="display:none"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ========== KEY POSITIONS ==========
   Maps Arabic letters/marks to their pixel position on the keyboard image (594×210).
   Coordinates are {x, y, w, h} of the key center-box.
   Row layout from screenshot, right-to-left in Arabic but left-to-right pixel-wise.
*/
const KB_W = 594, KB_H = 210;
const KEY_W = 38, KEY_H = 38;

// Helper to build a key entry
const k = (x, y, w = KEY_W, h = KEY_H) => ({ x, y, w, h });

// Row 1 (numbers row): ذ ١ ٢ ٣ ٤ ٥ ٦ ٧ ٨ ٩ ٠ - =
// Row 2: ض ص ث ق ف غ ع ه خ ح ج د
// Row 3: ش س ي ب ل ا ت ن م ك ط
// Row 4: ئ ء ؤ ر لا ى ة و ز ظ ,
const KEY_POSITIONS = {
  // Row 1: ذ ١ ٢ ٣ ٤ ٥ ٦ ٧ ٨ ٩ ٠ - =
  'ذ': k(9,12,34,28),
  '١': k(49,12,34,28), '1': k(49,12,34,28),
  '٢': k(89,12,34,28), '2': k(89,12,34,28),
  '٣': k(129,12,34,28),'3': k(129,12,34,28),
  '٤': k(169,12,34,28),'4': k(169,12,34,28),
  '٥': k(209,12,34,28),'5': k(209,12,34,28),
  '٦': k(249,12,34,28),'6': k(249,12,34,28),
  '٧': k(289,12,34,28),'7': k(289,12,34,28),
  '٨': k(329,12,34,28),'8': k(329,12,34,28),
  '٩': k(369,12,34,28),'9': k(369,12,34,28),
  '٠': k(409,12,34,28),'0': k(409,12,34,28),
  '-': k(449,12,34,28),
  '=': k(489,12,34,28),

  // Row 2: ض ص ث ق ف غ ع ه خ ح ج د
  'ض': k(65,51,34,30),  'ص': k(105,51,34,30), 'ث': k(145,51,34,30),
  'ق': k(185,51,34,30), 'ف': k(225,51,34,30), 'غ': k(265,51,34,30),
  'ع': k(305,51,34,30), 'ه': k(345,51,34,30), 'خ': k(385,51,34,30),
  'ح': k(425,51,34,30), 'ج': k(465,51,34,30), 'د': k(505,51,34,30),

  // Row 3: ش س ي ب ل ا ت ن م ك ط
  'ش': k(77,90,34,29),  'س': k(117,90,34,29), 'ي': k(157,90,34,29),
  'ب': k(197,90,34,29), 'ل': k(237,90,34,29), 'ا': k(277,90,34,29),
  'ت': k(317,90,34,29), 'ن': k(357,90,34,29), 'م': k(397,90,34,29),
  'ك': k(437,90,34,29), 'ط': k(477,90,34,29),

  // Row 4: ئ ء ؤ ر لا ى ة و ز ظ ,
  'ئ': k(57,129,34,29),  'ء': k(97,129,34,29),  'ؤ': k(137,129,34,29),
  'ر': k(177,129,34,29), 'لا': k(217,129,34,29),'ى': k(257,129,34,29),
  'ة': k(297,129,34,29), 'و': k(337,129,34,29), 'ز': k(377,129,34,29),
  'ظ': k(417,129,34,29), ',': k(457,129,34,29), '،': k(457,129,34,29),

  // Space
  ' ': k(180,165,240,31)
};

/* ========== STATE ========== */
const STORAGE_KEY = 'arabic-trainer-words-v1';
const SETTINGS_KEY = 'arabic-trainer-settings-v1';

const SAMPLE_WORDS = [
  { arabic: 'سلام', translit: 'salām — peace' },
  { arabic: 'كتاب', translit: 'kitāb — book' },
  { arabic: 'بيت',  translit: 'bayt — house' },
  { arabic: 'ماء',  translit: 'māʾ — water' },
  { arabic: 'شمس',  translit: 'shams — sun' },
  { arabic: 'قمر',  translit: 'qamar — moon' },
  { arabic: 'مدرسة', translit: 'madrasa — school' },
  { arabic: 'صديق', translit: 'ṣadīq — friend' }
];

let words = loadWords();
let settings = loadSettings();
let currentIdx = 0;
let typedCount = 0;
let errorCount = 0;
let hintVisible = settings.hintVisible || false;

/* ========== STORAGE ========== */
function loadWords() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}
function saveWords() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(words)); } catch (e) {}
}
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { hintVisible: false };
}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
}

/* ========== TABS ========== */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab + '-panel').classList.add('active');
    if (tab.dataset.tab === 'practice') {
      renderWord();
      setTimeout(() => document.getElementById('typing-input').focus(), 50);
    } else {
      renderList();
    }
  });
});

/* ========== PRACTICE RENDERING ========== */
const wordDisplay = document.getElementById('word-display');
const translitEl = document.getElementById('translit');
const wordIdxEl = document.getElementById('word-idx');
const errorCountEl = document.getElementById('error-count');
const hintStatusEl = document.getElementById('hint-status');
const typingInput = document.getElementById('typing-input');
const inputHintLabel = document.getElementById('input-hint-label');

function renderWord() {
  if (words.length === 0) {
    wordDisplay.innerHTML = '<span style="color:var(--ink-faint);font-size:1.5rem;font-style:italic;font-family:Cormorant Garamond,serif">add some words to begin →</span>';
    translitEl.textContent = '';
    wordIdxEl.textContent = '—';
    errorCountEl.textContent = '0';
    hideHighlight();
    return;
  }
  if (currentIdx >= words.length) currentIdx = 0;
  if (currentIdx < 0) currentIdx = words.length - 1;

  const word = words[currentIdx];
  // Split into visual letter units, treating "لا" as a single typed unit when present
  const letters = splitArabicWord(word.arabic);

  wordDisplay.innerHTML = letters.map((ch, i) =>
    `<span class="letter" data-i="${i}">${ch}</span>`
  ).join('');
  translitEl.textContent = word.translit || '';
  wordIdxEl.textContent = `${currentIdx + 1} / ${words.length}`;
  errorCountEl.textContent = errorCount;

  typedCount = 0;
  typingInput.value = '';
  updateHighlight();
}

function splitArabicWord(str) {
  // Treat ل + ا (lam-alef) as the special "لا" key on this keyboard
  const out = [];
  for (let i = 0; i < str.length; i++) {
    if (str[i] === 'ل' && str[i+1] === 'ا') {
      out.push('لا');
      i++;
    } else {
      out.push(str[i]);
    }
  }
  return out;
}

/* ========== TYPING LOGIC ========== */
typingInput.addEventListener('focus', () => inputHintLabel.classList.add('focused'));
typingInput.addEventListener('blur', () => inputHintLabel.classList.remove('focused'));

typingInput.addEventListener('input', (e) => {
  if (words.length === 0) { typingInput.value = ''; return; }

  const word = words[currentIdx];
  const target = splitArabicWord(word.arabic);
  const typed = splitArabicWord(typingInput.value);

  // Clear all letter states
  const letterEls = wordDisplay.querySelectorAll('.letter');
  letterEls.forEach(el => el.classList.remove('correct', 'error'));

  let correctSoFar = 0;
  let hadError = false;

  for (let i = 0; i < typed.length && i < target.length; i++) {
    if (typed[i] === target[i]) {
      if (letterEls[i]) letterEls[i].classList.add('correct');
      correctSoFar++;
    } else {
      // Mismatch — flash error on current letter, strip the bad char
      if (letterEls[i]) letterEls[i].classList.add('error');
      hadError = true;
      break;
    }
  }

  if (hadError) {
    errorCount++;
    errorCountEl.textContent = errorCount;
    // Roll input back to last correct state
    const goodTyped = target.slice(0, correctSoFar).join('');
    typingInput.value = goodTyped;
    typedCount = correctSoFar;
    // Re-render correct letters (we just stripped error)
    letterEls.forEach((el, i) => {
      el.classList.remove('error');
      if (i < correctSoFar) el.classList.add('correct');
    });
  } else {
    typedCount = typed.length;
  }

  updateHighlight();

  // Completed?
  if (typedCount === target.length) {
    onWordComplete();
  }
});

function onWordComplete() {
  // brief celebration, then advance
  setTimeout(() => {
    if (currentIdx < words.length - 1) {
      currentIdx++;
      renderWord();
    } else {
      // finished the list
      wordDisplay.innerHTML = '<div class="completion-banner"><div class="check">◆</div><p>list complete — restart to practice again</p></div>';
      translitEl.textContent = '';
      hideHighlight();
    }
  }, 450);
}

/* ========== KEYBOARD HINT ========== */
const overlay = document.getElementById('keyboard-overlay');
const highlight = document.getElementById('key-highlight');
const kbImg = document.getElementById('kb-img');

function setHintVisible(v) {
  hintVisible = v;
  settings.hintVisible = v;
  saveSettings();
  overlay.classList.toggle('visible', v);
  hintStatusEl.textContent = v ? 'on' : 'off';
  if (v) updateHighlight();
}

function updateHighlight() {
  if (!hintVisible || words.length === 0) { hideHighlight(); return; }
  const word = words[currentIdx];
  if (!word) { hideHighlight(); return; }
  const target = splitArabicWord(word.arabic);
  if (typedCount >= target.length) { hideHighlight(); return; }

  const nextChar = target[typedCount];
  const pos = KEY_POSITIONS[nextChar];
  if (!pos) { hideHighlight(); return; }

  // Scale to current displayed image size
  const imgW = kbImg.clientWidth;
  const imgH = kbImg.clientHeight;
  const sx = imgW / KB_W;
  const sy = imgH / KB_H;

  highlight.style.display = 'block';
  highlight.style.left = (pos.x * sx) + 'px';
  highlight.style.top  = (pos.y * sy) + 'px';
  highlight.style.width  = (pos.w * sx) + 'px';
  highlight.style.height = (pos.h * sy) + 'px';
}

function hideHighlight() { highlight.style.display = 'none'; }

window.addEventListener('resize', updateHighlight);
kbImg.addEventListener('load', updateHighlight);

/* ========== CONTROLS ========== */
document.getElementById('prev-btn').addEventListener('click', () => {
  if (words.length === 0) return;
  currentIdx = (currentIdx - 1 + words.length) % words.length;
  renderWord();
  typingInput.focus();
});
document.getElementById('skip-btn').addEventListener('click', () => {
  if (words.length === 0) return;
  currentIdx = (currentIdx + 1) % words.length;
  renderWord();
  typingInput.focus();
});
document.getElementById('reset-btn').addEventListener('click', () => {
  currentIdx = 0;
  errorCount = 0;
  renderWord();
  typingInput.focus();
});

/* ========== KEYBOARD SHORTCUTS ========== */
document.addEventListener('keydown', (e) => {
  // Cmd/Ctrl + K → toggle hint
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    setHintVisible(!hintVisible);
    toast(hintVisible ? 'keyboard hint on' : 'keyboard hint off');
  }
  // Cmd/Ctrl + ArrowRight → next word
  if ((e.metaKey || e.ctrlKey) && e.key === 'ArrowRight') {
    e.preventDefault();
    document.getElementById('skip-btn').click();
  }
  // Cmd/Ctrl + ArrowLeft → prev word
  if ((e.metaKey || e.ctrlKey) && e.key === 'ArrowLeft') {
    e.preventDefault();
    document.getElementById('prev-btn').click();
  }
});

/* ========== WORD LIST PANEL ========== */
const wordListEl = document.getElementById('word-list');
const listCountEl = document.getElementById('list-count');
const emptyStateEl = document.getElementById('empty-state');
const newArabicInput = document.getElementById('new-arabic');
const newTranslitInput = document.getElementById('new-translit');

function renderList() {
  wordListEl.innerHTML = '';
  listCountEl.textContent = words.length + (words.length === 1 ? ' word' : ' words');
  emptyStateEl.style.display = words.length === 0 ? 'block' : 'none';

  words.forEach((w, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="arabic-cell">${escapeHtml(w.arabic)}</td>
      <td class="translit-cell">${escapeHtml(w.translit || '')}</td>
      <td class="actions-cell">
        <button class="icon-btn" data-action="up" data-idx="${i}" title="move up">↑</button>
        <button class="icon-btn" data-action="down" data-idx="${i}" title="move down">↓</button>
        <button class="icon-btn" data-action="delete" data-idx="${i}" title="delete">✕</button>
      </td>
    `;
    wordListEl.appendChild(tr);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

wordListEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.icon-btn');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx);
  const action = btn.dataset.action;
  if (action === 'delete') {
    words.splice(idx, 1);
  } else if (action === 'up' && idx > 0) {
    [words[idx-1], words[idx]] = [words[idx], words[idx-1]];
  } else if (action === 'down' && idx < words.length - 1) {
    [words[idx+1], words[idx]] = [words[idx], words[idx+1]];
  }
  saveWords();
  renderList();
});

document.getElementById('add-btn').addEventListener('click', addWord);
newArabicInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addWord(); });
newTranslitInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addWord(); });

function addWord() {
  const ar = newArabicInput.value.trim();
  const tr = newTranslitInput.value.trim();
  if (!ar) { newArabicInput.focus(); return; }
  words.push({ arabic: ar, translit: tr });
  saveWords();
  newArabicInput.value = '';
  newTranslitInput.value = '';
  newArabicInput.focus();
  renderList();
  toast('added');
}

document.getElementById('load-sample').addEventListener('click', () => {
  if (words.length > 0 && !confirm('Append sample words to your existing list?')) return;
  words.push(...SAMPLE_WORDS);
  saveWords();
  renderList();
  toast('sample words added');
});

document.getElementById('clear-all').addEventListener('click', () => {
  if (!confirm('Delete all words? This cannot be undone.')) return;
  words = [];
  saveWords();
  renderList();
  currentIdx = 0;
  toast('list cleared');
});

document.getElementById('export-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(words, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'arabic-words.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error('not an array');
      const clean = data.filter(w => w && typeof w.arabic === 'string')
                        .map(w => ({ arabic: w.arabic, translit: w.translit || '' }));
      if (clean.length === 0) throw new Error('no valid words');
      if (confirm(`Import ${clean.length} words? This will replace your current list.`)) {
        words = clean;
        saveWords();
        renderList();
        toast(`imported ${clean.length} words`);
      }
    } catch (err) {
      toast('import failed — invalid file');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ========== TOAST ========== */
let toastTimeout;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('visible'), 1600);
}

/* ========== CLICK-TO-FOCUS ========== */
document.getElementById('input-hint-label').addEventListener('click', () => typingInput.focus());
wordDisplay.addEventListener('click', () => typingInput.focus());

/* ========== INIT ========== */
renderWord();
renderList();
setHintVisible(hintVisible);
setTimeout(() => typingInput.focus(), 100);
</script>
</body>
